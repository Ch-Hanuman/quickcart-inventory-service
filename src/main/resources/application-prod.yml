server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:inventory-db}:${DB_PORT:5432}/${DB_NAME:inventorydb}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true